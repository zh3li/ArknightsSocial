# 手工血缘/家族关系种子（type=family 边，权重最高）
# members 之间两两建立 family 边；name 仅作展示标签。
# 注意：members 写节点名或别名均可（构建时经别名表解析到当前节点名）。

families:
  - name: 临光家（卡西米尔）
    members: [临光, 玛莉娅·临光, 玛恩纳, 佐菲娅]
    note: 玛嘉烈（临光）与玛莉娅为姐妹，玛恩纳为叔父，佐菲娅为姑母

  - name: 希尔家（谢拉格·喀兰贸易）
    members: [银灰, 恩雅, 恩希亚]
    note: 恩希欧迪斯（银灰）、恩雅（初雪）、恩希亚（崖心）三兄妹

  - name: 龙门魏家（语料考证）
    members: [魏彦吾, 文月, 陈, 塔露拉]
    note: >
      魏彦吾与文月为夫妻（10.26_37_14「你要我一个人独活吗，彦吾？」，
      「如果我们有了孩子」示无子女）；陈称魏彦吾"舅舅"（主线07/别离之夜(下):334）；
      塔露拉为魏彦吾已故妹妹与爱德华·雅特利亚斯之女（凯尔希，变节之刃(下):220
      「爱德华·雅特利亚斯，也就是塔露拉·雅特利亚斯之父」；文月「她的面相和你的
      妹妹是那么像，但她的眼睛又像爱德华」）；陈与塔露拉为表姐妹

  - name: 雅特利亚斯家（乌萨斯）
    members: [塔露拉]
    note: 塔露拉·雅特利亚斯，父爱德华·雅特利亚斯；科西切为养父（存疑）；血缘边由龙门魏家承载

  - name: 蕾缪家（拉特兰）
    members: [能天使, 蕾缪安]
    note: 蕾缪乐（能天使）与蕾缪安为姐妹

  - name: 魔王家（卡兹戴尔）
    members: [特蕾西娅, 特雷西斯]
    note: 兄妹

  - name: 姐妹·芙蓉与炎熔（罗德岛）
    members: [芙蓉, 炎熔]
    note: 姐妹

  - name: 双子·星极与星源（莱塔尼亚）
    members: [星极, 星源]
    note: 双胞胎姐妹

  - name: 岁兽（巨兽「岁」的碎片）
    members: [年, 夕, 令, 黍, 颉]
    note: 同辈视作家人；一字真名由颉所取；未入库成员自动跳过
